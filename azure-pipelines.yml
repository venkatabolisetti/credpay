#pipeline code

pool:
  vmImage: ubuntu-latest

variables:
  acrServiceConnection: 'acrserviceconnection'
  frontendRepository: 'credpay/frontend'
  userRepository: 'credpay/user-service'
  paymentRepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'

stages:
  - stage: terraform
    displayName: terraform infra
    jobs:
      - job: terraformapply
        displayName: terraform init & apply
        steps:
          - checkout: self
          - task: TerraformInstaller@1
          
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: 'terraform'
              backendAzureRmUseEntraIdForAuthentication: false
              backendServiceArm: 'Azure subscription 1(40f4ed45-fd9a-44dd-aefb-f83446de9465)'
              backendAzureRmResourceGroupName: 'credpay_rg'
              backendAzureRmStorageAccountName: 'credpayproject'
              backendAzureRmContainerName: 'statefile'
              backendAzureRmKey: 'credpay.terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: 'terraform'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: 'terraform'
              environmentServiceNameAzureRM: 'Azure subscription 1(40f4ed45-fd9a-44dd-aefb-f83446de9465)'
          
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: 'terraform'
              commandOptions: '--auto-approve'
              environmentServiceNameAzureRM: 'Azure subscription 1(40f4ed45-fd9a-44dd-aefb-f83446de9465)'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              workingDirectory: 'terraform'
              commandOptions: '--auto-approve'
              environmentServiceNameAzureRM: 'Azure subscription 1(40f4ed45-fd9a-44dd-aefb-f83446de9465)'













